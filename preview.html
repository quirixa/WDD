<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Windows Progress Bar</title>

<style>
body {
    background: #f0f0f0;
    font-family: "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Window */
.window {
    width: 420px;
    background: #ffffff;
    border: 1px solid #cfcfcf;
    border-radius: 4px;
    padding: 16px;
}

/* Title */
.title {
    font-size: 14px;
    color: #000;
    margin-bottom: 12px;
}

/* Progress container */
.progress {
    width: 100%;
    height: 16px;
    background: #f3f3f3;
    border: 1px solid #c6c6c6;
    border-radius: 2px;
    overflow: hidden;
    position: relative;

    /* inset effect like Windows */
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.1);
}

/* Actual progress bar */
.bar {
    height: 100%;
    width: 0%;
    background: #107C10; /* Windows green */
    animation: load 6s linear forwards;
    position: relative;
}

/* subtle top highlight */
.bar::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    height: 50%;
    width: 100%;
    background: rgba(255,255,255,0.25);
}

/* moving light sweep */
.bar::after {
    content: "";
    position: absolute;
    top: 0;
    left: -30%;
    width: 30%;
    height: 100%;
    background: linear-gradient(
        to right,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,0.35) 50%,
        rgba(255,255,255,0) 100%
    );
    animation: shine 1.4s linear infinite;
}

/* Text */
.info {
    margin-top: 10px;
    font-size: 12px;
    color: #444;
}

/* Animations */
@keyframes load {
    from { width: 0%; }
    to { width: 100%; }
}

@keyframes shine {
    from { left: -30%; }
    to { left: 100%; }
}
</style>
</head>

<body>

<div class="window">
    <div class="title">Copying 2 items from Downloads to Documents</div>

    <div class="progress">
        <div class="bar"></div>
    </div>

    <div class="info">100 MB of 100 MB</div>
    <div class="info">Speed: 12.5 MB/s</div>
</div>

</body>
</html>
